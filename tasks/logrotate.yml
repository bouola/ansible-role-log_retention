---
- name: "Install logrotate"
  ansible.builtin.apt:
    name: "logrotate"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Write logrotate global defaults"
  ansible.builtin.template:
    src: "logrotate.conf.j2"
    dest: "/etc/logrotate.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  vars:
    _log_retention_logrotate_su: "{{ _log_retention_logrotate_su_by_distribution[ansible_facts['distribution']] }}"

# logrotate refuses a rule file that is group- or world-writable, and --debug checks its syntax without rotating.
- name: "Write logrotate rules"
  ansible.builtin.template:
    src: "logrotate-rule.j2"
    dest: "/etc/logrotate.d/{{ _log_retention_logrotate_rule.name }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "logrotate --debug %s"
  loop: "{{ log_retention_logrotate_rules | selectattr('state', 'undefined') | list
    + log_retention_logrotate_rules | selectattr('state', 'defined') | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    loop_var: _log_retention_logrotate_rule
    label: "{{ _log_retention_logrotate_rule.name }}"

- name: "Remove absent logrotate rules"
  ansible.builtin.file:
    path: "/etc/logrotate.d/{{ _log_retention_logrotate_rule.name }}"
    state: absent
  loop: "{{ log_retention_logrotate_rules | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: _log_retention_logrotate_rule
    label: "{{ _log_retention_logrotate_rule.name }}"

# Two rules on the same file, for example a custom rule next to the packaged one, are only detected on the whole
# configuration. --debug reads every rule and rotates nothing.
- name: "Check the whole logrotate configuration"
  ansible.builtin.command:
    argv:
      - logrotate
      - --debug
      - /etc/logrotate.conf
  register: _log_retention_logrotate_check
  changed_when: false
  check_mode: false
  failed_when: >-
    _log_retention_logrotate_check.rc != 0
    or _log_retention_logrotate_check.stderr is search('(?i)^error:', multiline=true)

- name: "Create logrotate timer drop-in directory"
  ansible.builtin.file:
    path: "/etc/systemd/system/logrotate.timer.d"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  when: log_retention_logrotate_timer_on_calendar != "daily"

- name: "Set logrotate timer schedule"
  ansible.builtin.template:
    src: "logrotate-timer.conf.j2"
    dest: "/etc/systemd/system/logrotate.timer.d/override.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart logrotate timer"
  when: log_retention_logrotate_timer_on_calendar != "daily"

- name: "Remove logrotate timer schedule override"
  ansible.builtin.file:
    path: "/etc/systemd/system/logrotate.timer.d/override.conf"
    state: absent
  notify: "Restart logrotate timer"
  when: log_retention_logrotate_timer_on_calendar == "daily"

- name: "Enable and start logrotate timer"
  ansible.builtin.systemd:
    name: "logrotate.timer"
    enabled: true
    state: started
